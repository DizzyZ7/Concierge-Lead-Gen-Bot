name: Workflow Self-Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reviewer-workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: concierge
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: concierge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://concierge:concierge@localhost:5432/concierge
      TIMEZONE: Asia/Bangkok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head && alembic current

      - name: Run isolated reviewer workflow self-test
        run: python -m scripts.workflow_selftest
